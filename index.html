<style>
:root { --ink: #f4efe2; --glass: rgba(24, 18, 12, .62); --accent: #f2c418; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2119; color: var(--ink); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
canvas { display: block; touch-action: none; cursor: grab; }
#ui { position: fixed; left: 16px; bottom: 16px; max-width: min(430px, calc(100vw - 32px)); padding: 18px 20px; box-sizing: border-box; border-radius: 18px; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
h1 { margin: 0 0 4px; font: 400 30px "Permanent Marker", system-ui, sans-serif; letter-spacing: .02em; color: var(--accent); }
p { margin: 0 0 14px; opacity: .92; }
small { display: block; margin-top: 10px; opacity: .7; }
button { font: 700 16px system-ui, sans-serif; color: #1d1608; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
button:disabled { cursor: default; opacity: .75; }
a { color: var(--accent); }
.immersive #ui { display: none; }
</style>
</head>
<body>
<div id="ui">
<h1>Demolition Boy</h1>
<p>His classroom. Empty. Mostly. Read the notes, mind the desk that looks back, and do not push the plunger on the teacher's desk.</p>
<button id="enter" disabled>Sweeping up the classroom…</button>
<small>Drag to look around, WASD to walk, click to touch things you shouldn't. <a href="https://www.nxtwebxr.com/">More WebXR experiences</a></small>
</div>
<script type="module" src="./demolitionboy.js"></script>
</body>
